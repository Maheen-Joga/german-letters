[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "german-letters"
version = "0.1.0"
description = "Formal German letters to DIN 5008 (cancellations, objections, GDPR requests) with the deadlines worked out and an English explanation. Also a Claude skill."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maheen Joga" }]
keywords = ["german", "din-5008", "kuendigung", "widerspruch", "expat", "letter", "claude-skill"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["german_letters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
